<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="120" y1="64" x2="904" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827" />
      <stop offset="0.55" stop-color="#0c0f16" />
      <stop offset="1" stop-color="#1b2436" />
    </linearGradient>
    <radialGradient id="atmosphere" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#7d8cff" stop-opacity="0.3" />
      <stop offset="0.6" stop-color="#7d8cff" stop-opacity="0.07" />
      <stop offset="1" stop-color="#7d8cff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="meridian" x1="256" y1="296" x2="768" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef1ff" />
      <stop offset="0.42" stop-color="#b9c1ff" />
      <stop offset="1" stop-color="#6f7dff" />
    </linearGradient>
    <linearGradient id="rim" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#tile)" />
  <rect width="1024" height="1024" rx="224" fill="url(#atmosphere)" />
  <rect x="6" y="6" width="1012" height="1012" rx="218" stroke="url(#rim)" stroke-width="12" />

  <!-- M built from two bowed meridian arcs -->
  <path
    d="M 300 730
       C 232 640 226 460 318 320
       L 512 552
       L 706 320
       C 798 460 792 640 724 730"
    stroke="url(#meridian)"
    stroke-width="96"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
